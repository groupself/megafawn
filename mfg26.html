<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEGAFAWN</title>
    <style>
        :root {
            --bg-color: #080808;
            --text-color: #ededed;
            --accent-color: #ff0055;
            --border-color: #262626;
            --panel-bg: #0f0f0f;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: "Courier New", Courier, monospace;
            margin: 0;
            padding: 2rem 1rem;
            line-align: 1.5;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            border: 4px solid var(--border-color);
            padding: 2rem;
            background: var(--panel-bg);
            box-shadow: 10px 10px 0px #000;
        }

        header h1 {
            font-size: clamp(2.5rem, 8vw, 5rem);
            margin: 0 0 1.5rem 0;
            text-transform: uppercase;
            letter-spacing: -3px;
            border-bottom: 4px solid var(--border-color);
            padding-bottom: 1rem;
        }

        .video-wrapper {
            margin: 2rem 0;
            border: 4px solid var(--border-color);
            background: #000;
        }

        .info-section {
            margin: 2rem 0;
            padding: 1.5rem;
            border: 2px dashed var(--border-color);
            background: #050505;
        }

        .info-section h2 {
            margin-top: 0;
            font-size: 1.1rem;
            text-transform: uppercase;
            color: var(--accent-color);
            letter-spacing: 1px;
        }

        /* Gallery grid for your existing photos/videos */
        .media-archive {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .media-item {
            border: 2px solid var(--border-color);
            background: #000;
            padding: 0.5rem;
        }

        .media-item img, .media-item video {
            width: 100%;
            height: auto;
            display: block;
            filter: grayscale(20%) contrast(110%);
        }

        .social-link {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 1rem 2rem;
            background: var(--text-color);
            color: var(--bg-color);
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            text-transform: uppercase;
            border: 2px solid var(--text-color);
            letter-spacing: 1px;
            transition: all 0.1s ease;
        }

        .social-link:hover {
            background: var(--accent-color);
            color: var(--text-color);
            border-color: var(--accent-color);
        }

        footer {
            margin-top: 3rem;
            font-size: 0.75rem;
            color: #555;
            text-align: center;
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>MegaFawn</h1>
        </header>

        <main>
            <!-- Primary Vimeo Embed -->
            <div class="video-wrapper">
                <div style="padding:100% 0 0 0;position:relative;">
                    <iframe src="https://player.vimeo.com/video/1231679828?badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479" frameborder="0" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" referrerpolicy="strict-origin-when-cross-origin" style="position:absolute;top:0;left:0;width:100%;height:100%;" title="47734"></iframe>
                </div>
                <script src="https://player.vimeo.com/api/player.js"></script>
            </div>

            <!-- Upcoming Performance Note -->
            <div class="info-section">
                <h2>Schedule</h2>
                <p>Planning for a debut in <strong>NYC in April 2027</strong>.</p>
            </div>

            <!-- Archive / Existing Media Section (Keeps your asset paths intact) -->
            <div class="media-archive">
                <!-- Example of how to structure your existing images/videos folder assets: -->
                <div class="media-item">
                    <img src="images/example-photo1.jpg" alt="Archive Image">
                </div>
                <div class="media-item">
                    <video src="videos/example-video1.mp4" controls muted></video>
                </div>
            </div>

            <!-- Prominent Instagram Link -->
            <a class="social-link" href="https://instagram.com/megafawn" target="_blank" rel="noopener">[@megafawn]</a>
        </main>

        <footer>
            <p>&copy; MegaFawn</p>
        </footer>
    </div>

</body>
</html>
