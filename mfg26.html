<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEGAFAWN</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --text-color: #f2f2f2;
            --accent-color: #ff3300;
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: "Courier New", Courier, monospace;
            line-height: 1.4;
            padding: 2vw;
            text-transform: uppercase;
        }

        header {
            border: 2px solid var(--border-color);
            padding: 2rem;
            margin-bottom: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 6rem);
            letter-spacing: -2px;
            line-height: 0.9;
            font-weight: 900;
        }

        .tagline {
            font-size: 1.1rem;
            color: #888;
        }

        main {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media (min-width: 900px) {
            main {
                grid-template-columns: 2fr 1fr;
            }
        }

        .video-container {
            border: 2px solid var(--border-color);
            padding: 1rem;
            background: #000;
        }

        .video-wrapper {
            padding: 56.25% 0 0 0;
            position: relative;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .info-panel {
            border: 2px solid var(--border-color);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 2rem;
        }

        .announcement {
            border-left: 4px solid var(--accent-color);
            padding-left: 1rem;
        }

        .announcement h2 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            color: var(--accent-color);
        }

        .announcement p {
            font-size: 1rem;
            color: #ccc;
        }

        .socials {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .socials a {
            display: inline-block;
            background: var(--text-color);
            color: var(--bg-color);
            padding: 1rem;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
            transition: background 0.1s ease, color 0.1s ease;
            border: 2px solid var(--text-color);
        }

        .socials a:hover {
            background: var(--accent-color);
            color: var(--text-color);
            border-color: var(--accent-color);
        }

        footer {
            margin-top: 2rem;
            border-top: 2px solid var(--border-color);
            padding-top: 1rem;
            font-size: 0.8rem;
            color: #666;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <header>
        <h1>MEGAFAWN</h1>
        <div class="tagline">// Kalan Sherrard</div>
    </header>

    <main>
        <section class="video-container">
            <div class="video-wrapper">
                <iframe src="https://player.vimeo.com/video/1231679828?badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479" frameborder="0" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" referrerpolicy="strict-origin-when-cross-origin" title="47734"></iframe>
            </div>
            <script src="https://player.vimeo.com/api/player.js"></script>
        </section>

        <aside class="info-panel">
            <div class="announcement">
                <h2>// STATUS</h2>
                <p>Planning for New York City debut / April 2027.</p>
            </div>

            <div class="socials">
                <a href="https://instagram.com/megafawn" target="_blank" rel="noopener noreferrer">@megafawn x</a>
            </div>
        </aside>
    </main>

    <footer>
        <span>MEGAFAWN // ALL RIGHTS RESERVED</span>
        <span>2026</span>
    </footer>

</body>
</html>
